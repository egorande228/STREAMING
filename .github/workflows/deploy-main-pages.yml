name: Deploy main site to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'sites/main/**'
      - '.github/workflows/deploy-main-pages.yml'
  workflow_dispatch:

concurrency:
  group: deploy-main-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@4 pages deploy dist --project-name kinglive-pages-main --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7616dece8b5aecd644f7f8e7a0b0522e
