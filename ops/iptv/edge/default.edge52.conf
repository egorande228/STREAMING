server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/kinglive-edge-access.log;
    error_log /var/log/nginx/kinglive-edge-error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host hls.livekinglive.win;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    proxy_buffering on;
    proxy_buffers 64 256k;
    proxy_busy_buffers_size 1m;
    proxy_max_temp_file_size 0;
    proxy_ignore_headers Cache-Control Expires;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;

    add_header Access-Control-Allow-Origin $kinglive_cors_origin always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, Origin, Accept, Content-Type" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
    add_header X-Edge "vps-150.251.114.52" always;
    add_header X-Cache $upstream_cache_status always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location = /edge-health {
        access_log off;
        proxy_pass http://127.0.0.1:8091/edge-health;
    }

    location = /health {
        access_log off;
        return 200 "edge ok\n";
    }

    location ~* ^/live/.+\.(ts|m4s|mp4|aac)$ {
        add_header Access-Control-Allow-Origin $kinglive_cors_origin always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Origin, Accept, Content-Type" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
        add_header X-Edge "vps-150.251.114.52" always;
        add_header X-Cache $upstream_cache_status always;
        proxy_pass http://kinglive_origin_hls;
        proxy_cache kinglive_hls;
        proxy_cache_key $scheme$proxy_host$uri;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 206 120s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        expires 30s;
    }

    location ~* ^/live/.+\.m3u8$ {
        add_header Access-Control-Allow-Origin $kinglive_cors_origin always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Origin, Accept, Content-Type" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
        add_header X-Edge "vps-150.251.114.52" always;
        add_header X-Cache $upstream_cache_status always;
        proxy_pass http://kinglive_origin_hls;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        expires -1;
    }

    location / {
        return 200 "KingLive VPS edge\nUse /live/<channel>/index.m3u8 when a restream is publishing.\n";
    }
}
