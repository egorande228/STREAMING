map $http_origin $kinglive_cors_origin {
    default $http_origin;
    "" "*";
}

proxy_cache_path /var/cache/nginx/hls levels=1:2 keys_zone=kinglive_hls:200m max_size=20g inactive=10m use_temp_path=off;

upstream kinglive_origin_hls {
    # Pull directly from origin MediaMTX HLS, not from origin Caddy :80.
    server 145.223.69.219:8888;
    keepalive 256;
}

