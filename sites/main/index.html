<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="KingLive matchday hub for fixtures, scores and match details." />
    <title>KingLive Matchday Hub</title>
    <link rel="preconnect" href="https://kinglive-football-api.figurator228.workers.dev" crossorigin />
    <link rel="preconnect" href="https://livekinglive.win" crossorigin />
    <link rel="preconnect" href="https://cdn-hls.livekinglive.win" crossorigin />
    <link rel="dns-prefetch" href="//kinglive-football-api.figurator228.workers.dev" />
    <link rel="dns-prefetch" href="//livekinglive.win" />
    <link rel="dns-prefetch" href="//cdn-hls.livekinglive.win" />
    <link rel="icon" type="image/svg+xml" href="./assets/kinglive-mark-flat.svg?v=20260515-flat" />
    <script src="./theme.js?v=20260826-public-themes"></script>
    <link rel="stylesheet" href="./styles.css?v=20260827-social-icons-equal" />
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z0RP8BW0F5"></script>
    <script src="./analytics-init.js?v=20260619-csp"></script>
    <script src="./config.js"></script>
    <script defer src="./url-propagation.js"></script>
    <script defer src="./app.js?v=20260827-social-icons"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="frame topbar-inner">
        <a class="brand" href="./" aria-label="KingLive home">
          <span class="brand-mark" aria-hidden="true">
            <img src="./assets/kinglive-3d-logo-optimized.png?v=20260702-mobile-lite" alt="" />
          </span>
        </a>

        <nav class="nav" aria-label="Primary">
          <a class="active" href="#schedule" id="nav-schedule">Schedule</a>
          <a href="#news" id="nav-groups">News</a>
        </nav>

        <div class="header-actions">
          <div class="theme-switch" data-theme-switch role="group" aria-label="Color theme">
            <button class="theme-option" type="button" data-theme-option="light" aria-label="Light" title="Light" aria-pressed="false">
              <img class="theme-icon" src="./assets/icons/sun.svg" alt="" width="18" height="18" aria-hidden="true" />
            </button>
            <button class="theme-option" type="button" data-theme-option="dark" aria-label="Dark" title="Dark" aria-pressed="false">
              <img class="theme-icon" src="./assets/icons/moon.svg" alt="" width="18" height="18" aria-hidden="true" />
            </button>
          </div>

          <button class="locale" type="button" aria-label="Language">
            <span class="locale-flag locale-flag-en" aria-hidden="true"></span>
            <span>EN</span>
            <span aria-hidden="true">⌄</span>
          </button>
        </div>
      </div>
    </header>

    <main class="frame page-stack">
      <section class="schedule-layout" id="schedule" aria-labelledby="schedule-title">
        <div class="match-column">
          <a class="sponsor-link match-sponsor-link" href="https://qweqr.sbs/jJQN6M" target="_blank" rel="nofollow sponsored noopener">
            <aside class="match-sponsor schedule-sponsor sponsor-slot" aria-label="Sponsored">
              <img
                id="top-banner-desktop"
                data-locale-top-banner
                data-en-src="../banners/melbet_top_en_1870x245.jpg"
                data-ar-src="../banners/melbet_top_ar_1870x245.jpg"
                src="../banners/melbet_top_en_1870x245.jpg"
                width="1870"
                height="245"
                alt="Sponsored"
                loading="lazy"
              />
            </aside>
          </a>

          <div class="section-heading">
            <div>
              <h2 id="schedule-title"><span id="schedule-title-prefix">Upcoming</span> <span id="schedule-title-accent">matches</span></h2>
              <div class="heading-line"></div>
            </div>
          </div>

          <div class="schedule-controls">
            <div class="match-day-tabs" data-match-day-tabs role="group" aria-label="Match day">
              <button class="match-day-tab" type="button" data-match-day="-1" aria-pressed="false">
                <span id="match-day-yesterday">Yesterday</span>
              </button>
              <button class="match-day-tab active" type="button" data-match-day="0" aria-pressed="true">
                <span id="match-day-today">Today</span>
              </button>
              <button class="match-day-tab" type="button" data-match-day="1" aria-pressed="false">
                <span id="match-day-tomorrow">Tomorrow</span>
              </button>
            </div>
          </div>

          <div class="match-list" id="match-grid" aria-live="polite">
            <article class="empty-card">Loading matches</article>
          </div>

        </div>
      </section>

      <section class="news-panel" id="news" aria-labelledby="news-title">
        <div class="section-heading compact">
          <div>
            <p class="section-kicker" id="news-kicker">Football pulse</p>
            <h2 id="news-title"><span id="news-title-prefix">Latest</span> <span id="news-title-accent">news</span></h2>
            <div class="heading-line"></div>
          </div>
          <div class="carousel-controls" aria-label="News carousel controls">
            <button class="carousel-button" type="button" data-news-scroll="-1" aria-label="Previous news">‹</button>
            <button class="carousel-button" type="button" data-news-scroll="1" aria-label="Next news">›</button>
          </div>
        </div>
        <div class="news-viewport">
          <div class="news-grid" id="news-grid" aria-live="polite">
            <article class="empty-card">Loading football news</article>
          </div>
        </div>
      </section>

      <a class="sponsor-link" href="https://qweqr.sbs/jJQN6M" target="_blank" rel="nofollow sponsored noopener">
        <aside class="sponsor-slot sponsor-footer" aria-label="Sponsored">
          <picture>
            <source media="(max-width: 760px)" srcset="../banners/footer_343x200_mockup_original.png" />
            <source media="(max-width: 1100px)" srcset="../banners/footer_728x160_mockup_original.png" />
            <img src="../banners/footer_1180x180_mockup_original.png" width="1423" height="76" alt="Sponsored" loading="lazy" />
          </picture>
        </aside>
      </a>
    </main>
    <aside class="social-dock" data-social-dock aria-label="Social contacts">
      <button class="social-dock-toggle" type="button" data-social-toggle aria-expanded="false" aria-label="Social contacts">
        <span>+</span>
      </button>
      <div class="social-dock-panel" data-social-panel></div>
    </aside>
  </body>
</html>
