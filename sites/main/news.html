<!doctype html>
<html lang="mn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="KingLive хөлбөмбөгийн мэдээний дэлгэрэнгүй." />
    <title>KingLive Хөлбөмбөгийн мэдээ</title>
    <link rel="icon" type="image/svg+xml" href="./assets/kinglive-mark-flat.svg?v=20260515-flat" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./config.js"></script>
    <script defer src="./news.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="frame topbar-inner">
        <a class="brand" href="./" aria-label="KingLive нүүр">
          <span class="brand-mark" aria-hidden="true">
            <img src="./assets/kinglive-3d-logo.png?v=20260528-3d" alt="" />
          </span>
        </a>

        <nav class="nav" aria-label="Үндсэн">
          <a href="./" id="nav-home-news">Нүүр</a>
          <a href="./#schedule" id="nav-schedule-news">Хуваарь</a>
          <a class="active" href="./#news-title" id="nav-news-news">Мэдээ</a>
        </nav>

        <button class="locale" type="button" aria-label="Хэл">
          <span>🇲🇳</span>
          <span>MN</span>
          <span aria-hidden="true">⌄</span>
        </button>
      </div>
    </header>

    <main class="frame page-stack">
      <article class="story-page" id="news-article" aria-live="polite">
        <p class="section-kicker" id="news-kicker">Хөлбөмбөгийн хэмнэл</p>
        <h1 id="news-loading-title">Мэдээ ачаалж байна</h1>
      </article>
    </main>
  </body>
</html>
