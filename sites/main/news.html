<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="KingLive football news story." />
    <title>KingLive Football News</title>
    <link rel="icon" type="image/svg+xml" href="./assets/kinglive-mark-flat.svg?v=20260515-flat" />
    <script src="./theme.js?v=20260826-public-themes"></script>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./config.js"></script>
    <script defer src="./news.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="frame topbar-inner">
        <a class="brand" href="./" aria-label="KingLive home">
          <span class="brand-mark" aria-hidden="true">
            <img src="./assets/kinglive-3d-logo-optimized.png?v=20260702-mobile-lite" alt="" />
          </span>
        </a>

        <nav class="nav" aria-label="Primary">
          <a href="./#schedule" id="nav-schedule-news">Schedule</a>
          <a class="active" href="./#news-title" id="nav-news-news">News</a>
        </nav>

        <div class="header-actions">
          <div class="theme-switch" data-theme-switch role="group" aria-label="Color theme">
            <button class="theme-option" type="button" data-theme-option="light" aria-label="Light" title="Light" aria-pressed="false">
              <img class="theme-icon" src="./assets/icons/sun.svg" alt="" width="18" height="18" aria-hidden="true" />
            </button>
            <button class="theme-option" type="button" data-theme-option="dark" aria-label="Dark" title="Dark" aria-pressed="false">
              <img class="theme-icon" src="./assets/icons/moon.svg" alt="" width="18" height="18" aria-hidden="true" />
            </button>
          </div>

          <button class="locale" type="button" aria-label="Language">
            <span class="locale-flag locale-flag-en" aria-hidden="true"></span>
            <span>EN</span>
            <span aria-hidden="true">⌄</span>
          </button>
        </div>
      </div>
    </header>

    <main class="frame page-stack">
      <article class="story-page" id="news-article" aria-live="polite">
        <p class="section-kicker" id="news-kicker">Football pulse</p>
        <h1 id="news-loading-title">Loading news</h1>
      </article>
    </main>
  </body>
</html>
