<!doctype html>
<html lang="mn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="KingLive HLS болон iframe эх сурвалжид зориулсан тусдаа шууд дамжуулалтын тоглуулагч." />
    <title>KingLive тоглуулагч</title>
    <link rel="preload" href="./assets/world-cup-hero.png" as="image" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.15/dist/hls.min.js"></script>
    <script defer src="./app.js"></script>
  </head>
  <body>
    <main class="shell">
      <section class="watch-layout">
        <div class="watch-main">
          <section class="ad-shell ad-leaderboard" data-ad-slot="player-top" data-ad-size="728x90">
            <span>Сурталчилгаа</span>
            <strong>728 x 90</strong>
          </section>
          <div class="player-grid">
            <section class="player-panel" aria-label="Шууд дамжуулалтын тоглуулагч">
              <header class="player-brand">
                <a class="brand" href="../main/" aria-label="KingLive нүүр">
                  <span class="brand-mark">K</span>
                  <span>
                    <span class="brand-kicker">KingLive</span>
                    <strong>Тоглуулагч</strong>
                  </span>
                </a>
              </header>
              <div class="stage" id="stage" aria-label="Тоглолт хүлээж байна">
              </div>
              <div class="controls" id="controls" hidden>
                <div>
                  <p class="eyebrow" id="now-playing-label">Одоо тоглуулж байна</p>
                  <h1 id="title">Шууд дамжуулалт</h1>
                </div>
                <div class="control-row">
                  <label>
                    <span id="source-label">Эх сурвалж</span>
                    <select id="source-select"></select>
                  </label>
                  <button class="button" id="copy-embed" type="button">iframe хуулах</button>
                </div>
              </div>
            </section>

            <aside class="chat-panel" id="chat-panel" aria-label="Тоглолтын чат" hidden>
              <header class="chat-head">
                <div>
                  <p class="eyebrow" id="chat-room-label">Шууд өрөө</p>
                  <h2 id="chat-title">Тоглолтын чат</h2>
                </div>
                <span class="chat-status" id="chat-status">Холбогдож байна</span>
              </header>
              <div class="chat-messages" id="chat-messages" aria-live="polite"></div>
              <form class="chat-form" id="chat-form">
                <label>
                  <span id="chat-author-label">Нэр</span>
                  <input id="chat-author" name="author" maxlength="24" autocomplete="nickname" placeholder="Зочин" />
                </label>
                <label>
                  <span id="chat-message-label">Зурвас</span>
                  <textarea id="chat-message" name="message" maxlength="240" rows="3" placeholder="Зурвас бичих"></textarea>
                </label>
                <button class="button chat-submit" id="chat-submit" type="submit">Илгээх</button>
              </form>
            </aside>
          </div>
          <section class="ad-shell ad-leaderboard" data-ad-slot="player-bottom" data-ad-size="728x90">
            <span>Сурталчилгаа</span>
            <strong>728 x 90</strong>
          </section>
        </div>
        <aside class="ad-shell ad-rail" data-ad-slot="player-rail" data-ad-size="300x600">
          <span>Сурталчилгаа</span>
          <strong>300 x 600</strong>
        </aside>
      </section>
      <div class="tg-popup" id="tg-popup" hidden></div>
    </main>
  </body>
</html>
