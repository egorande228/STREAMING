worker_processes auto;
worker_rlimit_nofile 200000;

pid /tmp/nginx.pid;

events {
    worker_connections 65535;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log off;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30s;
    keepalive_requests 10000;
    reset_timedout_connection on;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    proxy_buffering on;
    proxy_buffers 64 256k;
    proxy_busy_buffers_size 1m;
    proxy_max_temp_file_size 0;

    # MediaMTX sets cookies/cache headers for HLS access checks. Keep cookies
    # visible to clients, but ignore origin cache headers so nginx can cache
    # warmed HLS playlists and TS segments.
    proxy_ignore_headers Set-Cookie Cache-Control Expires;

    proxy_cache_path /var/cache/nginx/hls levels=1:2 keys_zone=hls_cache:200m max_size=20g inactive=5m use_temp_path=off;

    upstream mediamtx_hls {
        server 127.0.0.1:8888;
        keepalive 512;
    }

    server {
        listen 80 reuseport;
        listen 8080 reuseport;
        server_name _;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Origin, Accept, Content-Type" always;
        add_header X-Cache $upstream_cache_status always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        location = /health {
            return 200 "ok\n";
        }

        location ~* ^/live/.+\.(ts|m4s|mp4)$ {
            proxy_pass http://mediamtx_hls;
            proxy_cache hls_cache;
            proxy_cache_key $scheme$proxy_host$uri;
            proxy_cache_methods GET HEAD;
            proxy_cache_valid 200 206 120s;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 10s;
            proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
            expires 30s;
        }

        location ~* ^/live/.+\.m3u8$ {
            proxy_pass http://mediamtx_hls;
            proxy_cache hls_cache;
            proxy_cache_key $scheme$proxy_host$uri$is_args$args;
            proxy_cache_methods GET HEAD;
            proxy_cache_valid 200 1s;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
            expires -1;
        }

        location / {
            proxy_pass http://mediamtx_hls;
            proxy_buffering on;
        }
    }
}
